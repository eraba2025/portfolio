ת הצבעה. זה מדלל את בעלי המניות הקיימים בכ-6%: כל מניה שלך תהיה חלק קטן יותר מהחברה.</li>\n</ul>\n<h2>FCF ב-12 החודשים האחרונים, מאומת מול הדוחות הרשמיים</h2>\n<ul>\n<li><strong>מקור:</strong> EDGAR, מאגר הדוחות של רשות ניירות הערך האמריקאית (SEC).</li>\n<li><strong>החישוב:</strong> תזרים מפעילות של $133.1B פחות השקעות של $104.4B, כלומר כ-$28.6B. החישוב לא כולל החזרי קרן על חכירות.</li>\n<li><strong>תשואת FCF:</strong> כ-1.8%. כלומר, ה-FCF השנתי שווה ל-1.8% משווי החברה.</li>\n<li><strong>התחזית:</strong> החברה צופה הכנסות של $73–76B ברבעון 4.</li>\n</ul>\n<h2>תמחור</h2>\n<ul>\n<li><strong>מכפיל רווח צפוי:</strong> 17.0. זה המחיר חלקי הרווח הצפוי למניה בשנה הבאה. לשם השוואה: GOOG ‏18.3, MSFT ‏21.0, AMZN ‏22.5. META הזולה מבין ענקיות הטכנולוגיה.</li>\n<li><strong>שווי הוגן (הערכה גסה):</strong> $569–$783, ובאמצע כ-$676. החישוב: רווח צפוי של $35.6 למניה, כפול מכפיל של 16 עד 22.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>מכונת הפרסום ממשיכה לצמוח ב-26%.</li>\n<li>הזולה מבין ענקיות הטכנולוגיה.</li>\n<li>מנהלת את הוצאות כוח האדם בקפדנות: מספר העובדים ירד ב-15%.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li>ה-FCF נעשה שלילי בגלל ההשקעות.</li>\n<li>הנפקת המניות תדלל את בעלי המניות הקיימים.</li>\n<li>סיכונים משפטיים: ההוצאה של $9.9B ברבעון הזה.</li>\n<li>מארק צוקרברג שולט בחברה, ולבעלי המניות האחרים כמעט אין השפעה על ההחלטות.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<p>צמיחת ההכנסות יורדת מתחת ל-15%, בזמן שההשקעות ממשיכות לעלות.</p>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>לא לחזק לפני שיתבהרו פרטי הנפקת המניות והתחזית להשקעות ב-2027.</strong></li>\n<li><strong>אחרי שיתבהרו, ואם המחיר מתחת ל-$570:</strong> לבחון חיזוק, אבל רק אם החשיפה הכוללת תישאר עד 9% משווי המניות.</li>\n<li><strong>אם האירוע שמפריך את התזה מתרחש:</strong> לבחון צמצום ל-5%.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>את היקף הדילול (כ-6%) חישבתי בעצמי: $95B חלקי שווי שוק של $1.55T.</li>\n<li>את הפרטים על הנפקת המניות לקחתי מכתבה ב-applescoop.org ולא מהודעה רשמית של החברה.</li>\n<li><stro  ["2026-10-30", 240.35, 254.28, 243.4], ["2026-11-02", 245.63, 254.02, 243.44]], "html": "<p><strong>שורה תחתונה: להחזיק. לא לחזק עד שתזרים המזומנים יתחיל להשתפר.</strong>\n- <strong>העסק:</strong> AWS, שירותי הענן של אמזון, צומח כמו לפני 5 שנים.\n- <strong>התזרים:</strong> אמזון משקיעה יותר כסף ממה שהיא מייצרת. לכן אין כרגע סיבה למהר להוסיף.</p>\n<h2>הפוזיציה שלך</h2>\n<ul>\n<li><strong>כמות ומחיר קנייה:</strong> 6.6707 מניות במחיר ממוצע של $217.36. המחיר היום $245.63, כלומר רווח של 13%.</li>\n<li><strong>משקל:</strong> 7.8% מהמניות ישירות. יחד עם מה שמוחזק דרך קרנות סל, כ-8.8%.</li>\n<li><strong>מקור המחירים:</strong> Yahoo Finance דרך yfinance, מחירי סגירה ל-2.11.2026 (נמשכו ב-3.11.2026).</li>\n</ul>\n<h2>העסק והחפיר</h2>\n<ul>\n<li><strong>שלושה מנועים:</strong> מסחר מקוון, ענן (AWS) ופרסום.</li>\n<li><strong>החפיר (היתרון שקשה למתחרים להעתיק):</strong></li>\n<li>רשת לוגיסטיקה ענקית.</li>\n<li>מנויי Prime.</li>\n<li>AWS, ספקית הענן הגדולה בעולם.</li>\n</ul>\n<h2>רבעון 3 (CNBC, 29.10.2026)</h2>\n<ul>\n<li><strong>הכנסות:</strong> $201.9B, עלייה של 12%. מעט מתחת לציפיות.</li>\n<li><strong>רווח למניה (EPS):</strong> $1.89, לעומת $1.96 שציפו האנליסטים.</li>\n<li><strong>AWS:</strong> $46.0B, עלייה של 39%. הצמיחה המהירה ביותר מזה כמעט 5 שנים.</li>\n<li><strong>פרסום:</strong> $19.6B, לעומת $20.8B שציפו האנליסטים.</li>\n<li><strong>השקעות:</strong> $77.3B ברבעון אחד. התחזית ל-2026 היא כ-$220B, ולפי ההנהלה ב-2027 יושקע \"משמעותית יותר\".</li>\n</ul>\n<h2>תזרים מזומנים חופשי (FCF) ב-12 החודשים האחרונים (TTM)</h2>\n<ul>\n<li><strong>מקור:</strong> הדוחות הרשמיים ב-EDGAR, מאגר הדוחות של רשות ניירות ערך האמריקאית.</li>\n<li><strong>החישוב:</strong> תזרים מפעילות של $168.3B, פחות השקעות של $215.2B, נותן כ-מינוס $46.9B.</li>\n<li><strong>הנתון הרשמי של החברה:</strong> מינוס $42.4B, כי היא מקזזת תקבולים ותמריצים שקיבלה.</li>\n<li><strong>המשמעות:</strong> ה-FCF שלילי, כלומר החברה מוציאה יותר משהיא מכניסה.</li>\n</ul>\n<h2>תמחור</h2>\n<ul>\n<li><strong>מכפיל רווח צפוי של 22.5. >\n<li><strong>מה היא מוכרת:</strong> שבבים מסוג GPU, מערכות שלמות לחוות שרתים של AI, וציוד רשת.</li>\n<li><strong>החפיר:</strong> CUDA, פלטפורמת התוכנה שכמעט כל מפתחי ה-AI עובדים איתה. מעבר ממנה למתחרה דורש לשכתב קוד, ולכן לקוחות לא עוזבים בקלות.</li>\n<li><strong>הביקוש עולה על ההיצע:</strong> לפי סמנכ\"לית הכספים, התחזית לצמיחה של כ-70% בשנת הכספים 2028 מוגבלת בעיקר בגלל מחסור בהיצע (TIKR, אוקטובר 2026).</li>\n</ul>\n<h2>נתונים פיננסיים</h2>\n<ul>\n<li><strong>הכנסות ב-12 החודשים האחרונים (TTM):</strong> כ-$303B, עלייה של 106%.</li>\n<li><strong>רווחיות:</strong> שולי רווח גולמי 75%, שולי רווח תפעולי 66%.</li>\n<li><strong>תזרים מזומנים חופשי (FCF) ב-12 החודשים האחרונים:</strong> כ-$127B. אימתתי מול דוחות EDGAR, מאגר הדוחות הרשמי של רשות ניירות ערך האמריקאית, עד 26.7.2026: תזרים מפעילות של $134.4B פחות השקעות של $7.4B.</li>\n<li>Yahoo מציג $41.8B, ונראה שזו טעות אצלם.</li>\n<li>תשואת FCF: כ-2.6%. כלומר, ה-FCF השנתי שווה ל-2.6% משווי השוק של החברה.</li>\n<li><strong>מאזן:</strong> מזומן $62.5B מול חוב $38.9B, כלומר יותר מזומן מחוב.</li>\n</ul>\n<h2>תמחור מול מתחרות (Yahoo, 3.11.2026)</h2>\n<p>מכפיל רווח צפוי (Forward P/E) = מחיר המניה חלקי הרווח למניה הצפוי בשנה הבאה.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>מכפיל רווח צפוי</th>\n<th>שולי רווח תפעולי</th>\n<th>צמיחת הכנסות</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>NVDA</td>\n<td>12.7</td>\n<td>66%</td>\n<td>106%</td>\n</tr>\n<tr>\n<td>AMD</td>\n<td>29.2</td>\n<td>17%</td>\n<td>50%</td>\n</tr>\n<tr>\n<td>Broadcom (AVGO)</td>\n<td>16.6</td>\n<td>54%</td>\n<td>86%</td>\n</tr>\n</tbody>\n</table>\n<p><strong>שווי הוגן (הערכה גסה): $180–$330, באמצע כ-$250.</strong>\n- הבסיס: הרווח למניה הצפוי, $15.9, כפול מכפיל של 15 עד 22.\n- הקצה התחתון ($180) מניח שהרווח יצא נמוך ב-25% מהצפי.\n- <strong>המסקנה:</strong> המחיר היום ($202) נמצא בשליש התחתון של הטווח.</p>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>מובילה בשוק שבבי ה-AI, עם חפיר תוכנה (CUDA).</li>\n<li>ביקוש שעולה על ההיצע עד 2028.</li>\n<li>מכפיל צפוי של 12.7. זה הנמוך ביותר שלה ב-5 השנים האחרונות.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li><strong>כמה לקוחות מחזיקים חלק גדול מהחובות אליה:</strong> בסוף יולי, חמישה לקוחות היו חייבים לה 70% מכל הכסף שלקוחות חייבים לה ($63.1B).</li>\n<li><strong>Nvidia מממנת חלק מהלקוחות שלה:</strong> למשל השקעה של $3B ב-Meta. אם הלקוחות ייכנסו לקשיים, גם היא תיפגע.</li>\n<li><strong>שבבים מתחרים:</strong> גוגל, אחת הלקוחות הגדולות שלה, מפתחת ומוכרת שבבים משלה.</li>\n<li><strong>ריבית עולה:</strong> מייקרת את המימון של חוות השרתים, ועלולה להאט את קצב הבנייה שלהן.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<ul>\n<li>בדוח של 17.11.2026 Nvidia נותנת תחזית לרבעון הבא שמראה צמיחה של פחות מ-5% לעומת הרבעון הנוכחי.</li>\n<li>או ששולי הרווח הגולמי יורדים מתחת ל-70%.</li>\n</ul>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>תקרה:</strong> סך כל החשיפה ל-Nvidia (ישירה ודרך קרנות) לא יעלה על 10% מהמניות. היום היא 9.1%, כלומר נשאר מקום לתוספת של כ-$150–$200 בלבד.</li>\n<li><strong>אם הדוח טוב והמחיר מתחת ל-$220:</strong> לבחון תוספת קטנה.</li>\n<li><strong>מתחת ל-$180, והתזה עדיין עומדת:</strong> זו הנקודה הטובה ביותר לחיזוק.</li>\n<li><strong>אם האירוע המפריך מתרחש:</strong> לבחון צמצום חזרה ל-5%.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>הרווח הצפוי לשנה הבאה ($15.9) הוא כפול מהרווח של 12 החודשים האחרונים ($7.91). אם הצפי הזה לא יתממש, המכפיל הצפוי הנמוך מטעה.</li>\n<li>אין כאן מודל DCF (הערכת שווי לפי היוון תזרימי מזומנים עתידיים).</li>\n</ul>\n<p><strong>מקורות:</strong> SEC EDGAR (10-K מ-25.2.2026, 10-Q מ-26.8.2026); Yahoo Finance (3.11.2026); TIKR; CNBC; Business Insider (כולם מאוקטובר 2026).</p>"}, {"t": "TSLA", "title": "TSLA – Tesla | סקירת EB מקוצרת | 3.11.2026", "desc": "מניה; רכב חשמלי/רובוטיקה", "qty": 3.111, "cost": 333.78, "price": 403.82, "value": 1256.28, "pnl": 21.0, "w": 5.7, "v": "risky", "vl": "מסוכנת", "lv": [450], "s": [["2024-11-04", 242.84, null, null], ["2024-11-06", 288.53, null, null], ["2024-11-08", 321.22, null, null], ["2024-11-12", 328.49, null, null], ["2024-11-14", 311.  היום $403.82, כלומר רווח של 21%.</li>\n<li><strong>משקל:</strong> 6.0% משווי המניות. יחד עם מה שמוחזק דרך קרנות, כ-6.6%.</li>\n<li><strong>בטא 2.2:</strong> כשהשוק זז ב-1%, המניה זזה בממוצע בערך 2.2%.</li>\n<li><strong>מקור המחירים:</strong> Yahoo Finance דרך yfinance, מחירי סגירה ל-2.11.2026 (נמשכו ב-3.11.2026).</li>\n</ul>\n<h2>העסק והחפיר</h2>\n<ul>\n<li><strong>מה החברה מוכרת:</strong></li>\n<li>רכבים חשמליים.</li>\n<li>אגירת אנרגיה.</li>\n<li>FSD, תוכנת נהיגה אוטונומית שנמכרת כתוספת לרכב.</li>\n<li>שירות Robotaxi: מוניות בלי נהג באוסטין, והשקה בדאלאס מתוכננת לנובמבר.</li>\n<li><strong>החפיר (היתרון שקשה למתחרים להעתיק):</strong> נתוני נהיגה מכמות עצומה של רכבים על הכביש, ייצור משולב בתוך החברה, ומותג חזק.</li>\n<li><strong>מה מחליש את החפיר:</strong> ברכבים החשמליים, BYD הסינית ויצרנים סיניים נוספים מתחרים בה במחיר.</li>\n</ul>\n<h2>רבעון 3 (Tesla Q3 Update, 21.10.2026)</h2>\n<ul>\n<li><strong>מסירות רכבים:</strong> 486,532, ירידה של 2%.</li>\n<li><strong>הכנסות:</strong> $28.05B, בלי שינוי לעומת אשתקד.</li>\n<li><strong>שולי רווח תפעולי:</strong> 2.6%.</li>\n</ul>\n<h2>תזרים מזומנים חופשי (FCF) ב-12 החודשים האחרונים</h2>\n<p>FCF הוא המזומן שנשאר לחברה אחרי ההשקעות.\n- <strong>הנתון:</strong> כ-$3.3B. החישוב: תזרים מפעילות של $18.7B, פחות השקעות ברכוש קבוע של $15.4B.\n- <strong>מקור:</strong> EDGAR, מאגר הדוחות של רשות ניירות הערך האמריקאית, נכון ל-30.9.2026.\n- <strong>תשואת FCF:</strong> 0.2% בלבד. כלומר, ה-FCF השנתי שווה ל-0.2% משווי החברה.\n- <strong>מאזן:</strong> $45.4B מזומן מול $16.4B חוב, כלומר יותר מזומן מחוב.</p>\n<h2>תמחור (Yahoo, 3.11.2026)</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>מכפיל רווח היסטורי</th>\n<th>מכפיל רווח צפוי</th>\n<th>מכפיל מכירות</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TSLA</td>\n<td>444</td>\n<td>187</td>\n<td>15.4</td>\n</tr>\n<tr>\n<td>GM</td>\n<td>19.7</td>\n<td>6.1</td>\n<td>0.4</td>\n</tr>\n<tr>\n<td>BYD</td>\n<td>17.9</td>\n<td>10.9</td>\n<td>0.1</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>מכפיל רווח:</strong> המחיר חלקי הרווח למניה. ההיסטורי מחושב לפי 12 החודשים האחרונים, והצפוי לפי הרווח שהאנליסטים צופים לשנה הבאה.</li>\n<li><strong>מכפיל מכירות:</strong> שווי החברה חלקי ההכנסות.</li>\n<li><strong>המשמעות:</strong> עסק הרכב לבדו לא מצדיק את המחיר. אין טווח שווי הוגן אמין, כי השווי תלוי כמעט כולו בתוצאה של Robotaxi ו-Optimus.</li>\n<li><strong>מחיר יעד ממוצע של אנליסטים:</strong> $413, כמעט זהה למחיר היום.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>Robotaxi כבר פועל: כמעט 2 מיליון מיילים בלי נהג, והתרחבות לדאלאס.</li>\n<li>FSD מותקנת ביותר מ-75% מהרכבים החדשים שנמסרים בצפון אמריקה.</li>\n<li>יש לה הרבה מזומן כדי לממן את ההימורים האלה.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li>המכפילים קיצוניים, ויש תנודתיות גבוהה.</li>\n<li>עסק הרכב מתכווץ.</li>\n<li>הכול תלוי בהצלחה של טכנולוגיה שעוד לא הוכחה בהיקף גדול.</li>\n<li>סיכון \"איש מפתח\": החברה תלויה מאוד באילון מאסק.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<ul>\n<li>דחייה של FSD בלי נהג, שתוכנן ל-2027.</li>\n<li>או עיכוב בהרחבת Robotaxi מעבר לאוסטין ודאלאס.</li>\n</ul>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>משקל:</strong> המשקל כבר 6%, וזה הרבה לפוזיציה ספקולטיבית. לבחון צמצום ל-3%–4%, כלומר מכירה של כשליש מהמניות. זה גם יקבע חלק מהרווח.</li>\n<li><strong>אם המניה עולה מעל $450:</strong> לבחון מחדש צמצום.</li>\n<li><strong>אם מתרחש אחד האירועים המפריכים:</strong> לבחון יציאה מהפוזיציה ברובה.</li>\n<li><strong>חיזוק:</strong> לא לחזק.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>אין כאן מודל שווי מלא (DCF, היוון תזרימי מזומנים עתידיים) לעסקי Robotaxi ו-Optimus, וכל מודל כזה יהיה ספקולטיבי מאוד.</li>\n<li><strong>מקורות:</strong> Tesla Q3 2026 Update; CNBC; TeslaNorth; SEC EDGAR.</li>\n</ul>"}, {"t": "MSFT", "title": "MSFT – Microsoft | סקירת EB מקוצרת | 3.11.2026", "desc": "מניה; מגה-טק/ענן", "qty": 2.2465, "cost": 445.33, "price": 507.12, "value": 1139.25, "pnl": 13.9, "w": 5.17, "v": "add", "vl": "לחזק", "lv": [484, 500, 653], "s": [["2024-11-04", 402.11, null, null], ["2024-11-06", 413.65, null, n , כלומר היתרון שמגן עליה מתחרות:</strong></li>\n<li>נתח שוק עצום בחיפוש ובפרסום.</li>\n<li>מיליארדי משתמשים, ונתונים שאין כמעט לאף אחד אחר.</li>\n<li>הקושי למתחרים לבנות את כל זה מאפס.</li>\n</ul>\n<h2>רבעון 3 של 2026 (CNBC, AP, 28.10.2026)</h2>\n<ul>\n<li><strong>הכנסות:</strong> $127.6B, עלייה של 25% לעומת שנה קודם, אבל קצת מתחת לצפי.</li>\n<li><strong>חיפוש:</strong> ההכנסות עלו 12%, גם הן מתחת לצפי.</li>\n<li><strong>רווח מתואם למניה:</strong> $2.67, לעומת צפי של $3.02. זו הפעם הראשונה מאז 2022 שהחברה מפספסת את התחזיות.</li>\n<li><strong>תזרים חופשי ברבעון:</strong> מינוס $9.1B. תזרים חופשי (FCF) הוא הכסף שנשאר לחברה אחרי ההשקעות.</li>\n<li><strong>השקעות ברבעון:</strong> $51.4B. התחזית ל-2026 היא $195–205B, ול-2027 יותר מ-$300B.</li>\n<li><strong>חוב לטווח ארוך:</strong> $125.1B, לעומת $21.6B לפני שנה.</li>\n</ul>\n<h2>תזרים חופשי ב-12 החודשים האחרונים, אימות מול הדוחות הרשמיים</h2>\n<ul>\n<li><strong>מקור:</strong> EDGAR, מאגר הדוחות של רשות ניירות ערך האמריקאית.</li>\n<li><strong>החישוב:</strong> תזרים מפעילות של $179.6B, פחות השקעות של $159.8B, נותן תזרים חופשי של כ-$19.8B.</li>\n<li><strong>מה זה אומר:</strong> תשואת FCF של 0.6% בלבד, כלומר הכסף הפנוי בשנה שווה רק 0.6% משווי החברה. שנה קודם התזרים היה גבוה בהרבה.</li>\n<li><strong>שימו לב:</strong> Yahoo מציג מספר שלילי (‎-$1.2B), כנראה בהגדרה שונה.</li>\n</ul>\n<h2>תמחור (Yahoo, 3.11.2026)</h2>\n<ul>\n<li><strong>מכפיל רווח צפוי:</strong> 18.3. מכפיל הוא מחיר המניה חלקי הרווח למניה. לשם השוואה: MSFT ‏21.0, META ‏17.0, AMZN ‏22.5.</li>\n<li><strong>המכפיל ההיסטורי (14.5) מטעה:</strong> הרווח של 12 החודשים האחרונים מנופח בגלל רווחים חשבונאיים על האחזקות ב-SpaceX וב-Anthropic.</li>\n<li><strong>שווי הוגן (הערכה גסה):</strong> $258–$349, והאמצע כ-$300. החישוב: הרווח הצפוי לשנה הבאה, $15.19 למניה, כפול מכפיל של 17 עד 23. המחיר היום, $278, בחלק התחתון של הטווח.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>חפיר עמוק בחיפוש, ביוטיוב ובענן.</li>\n<li>Alphabet מחזיקה את כל שרשרת ה-AI בעצמה: שבבים, מודלים, ענן ומשתמשים.</li>\n<li>המכפיל קרוב לשל MSFT ו-META, למרות צמיחה של 25%.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li><strong>התזרים נשחק:</strong> ההשקעות ממומנות בחוב, והתזרים החופשי ירד לכמעט אפס.</li>\n<li><strong>ההשקעות ממשיכות לטפס:</strong> יותר מ-$300B ב-2027.</li>\n<li><strong>החיפוש מאט:</strong> צמיחה של 12%, עם איום מצד צ'אטבוטים.</li>\n<li><strong>הנהלה:</strong> ה-CFO הזהירה מלחץ על שולי הרווח בטווח הקרוב, וכתבי CNBC תיארו את שיחת הדוחות כ\"מבולגנת\".</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<ul>\n<li>בדוח של רבעון 4 (בסביבות תחילת פברואר 2027) ההשקעות ל-2027 יהיו יותר מ-$300B, וצמיחת הענן לא תאיץ.</li>\n<li>או שהכנסות החיפוש יצמחו בפחות מ-8%.</li>\n</ul>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>לא לחזק לפני הדוח של רבעון 4.</strong></li>\n<li><strong>מתחת ל-$258, וצמיחת החיפוש עדיין 10% או יותר:</strong> לבחון חיזוק עד כ-6% מהמניות.</li>\n<li><strong>אם האירוע המפריך מתרחש:</strong> לבחון צמצום חלקי, ולשמור על הרווח שכבר צברת.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>נתוני הרבעון לקוחים מכתבות ולא מהדוח המלא (10-Q).</li>\n<li>ה-FCF חושב לפי סעיף ההשקעות ברכוש קבוע בלבד, בלי חכירות מימוניות.</li>\n</ul>\n<p><strong>מקורות:</strong> SEC EDGAR (10-Q מ-29.10.2026); CNBC (28–29.10.2026); AP; CNBC TV18; Yahoo Finance (3.11.2026).</p>"}, {"t": "IBIT", "title": "IBIT – iShares Bitcoin Trust | סקירת תפקיד (קרן סל) | 3.11.2026", "desc": "קרן סל; ביטקוין", "qty": 22.8087, "cost": 53.48, "price": 43.35, "value": 988.76, "pnl": -18.9, "w": 4.49, "v": "hold", "vl": "להחזיק", "lv": [], "s": [["2024-11-04", 38.25, null, null], ["2024-11-06", 43.4, null, null], ["2024-11-08", 43.69, null, null], ["2024-11-12", 51.05, null, null], ["2024-11-14", 49.73, null, null], ["2024-11-18", 52.13, null, null], ["2024-11-20", 53.72, null, null], ["2024-11-22", 56.49, null, null], ["2024-11-26", 51.7, null, null], ["2024-11-29", 55.21, null, null], ["2024-12-03", 54.46, null, null], ["2024-12-05", 56.4, null, null], ["2024-12-09", 54.73, null, null], ["2024-12-11", 57.72 li><strong>יציאת כסף מהקרנות:</strong> ב-22.10 יצאו $635M מקרנות הביטקוין האמריקאיות. מתוכם $254M יצאו מ-IBIT.</li>\n<li><strong>מחיר הקנייה הממוצע של קרנות הביטקוין:</strong> כ-$81,500, לפי Glassnode. היום ביטקוין נסחר מתחת לרמה הזו.</li>\n<li><strong>מקורות:</strong> Decrypt, CryptoSlate, Bitcoin Magazine, כולם מאוקטובר 2026.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>גידור לטווח ארוך מפני פיחות מטבעות.</li>\n<li>גישה פשוטה וזולה לביטקוין.</li>\n<li>ההיצע של ביטקוין מוגבל.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li>אין הכנסה, אין רווח ואין דרך לחשב שווי.</li>\n<li>רגיש מאוד לריבית.</li>\n<li>ירידה של 38% מהשיא.</li>\n<li>אין הגנה לתיק, כי הוא נע יחד עם הטכנולוגיה.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<ul>\n<li>ביטקוין סוגר מתחת ל-$77,600. זה \"הממוצע האמיתי של השוק\" לפי Glassnode.</li>\n<li>ובמקביל ממשיכה יציאת כסף מהקרנות.</li>\n</ul>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>מה לעשות:</strong> להחליט על משקל יעד קבוע, למשל 3%–5% מהמניות, ולאזן אליו פעם ברבעון. לא לפעול לפי כותרות.</li>\n<li><strong>אם המשקל עולה מעל 6%:</strong> לבחון מימוש חלקי.</li>\n<li><strong>מתי לחזק:</strong> רק אם בו-זמנית תשואות האג\"ח יורדות וכסף חוזר להיכנס לקרנות.</li>\n<li><strong>בירידה מתחת ל-$77.6K:</strong> לבחון אם אתה בכלל מוכן לשאת סיכון כזה. זו בחינה עצמית ולא סימן לפעולה.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>אין כאן ניתוח שווי, מפני שזה לא אפשרי לנכס כזה.</li>\n<li>המספרים על זרימות הכסף לקרנות הם של אתרי חדשות קריפטו, ולא אימתתי אותם מול נתוני בלקרוק.</li>\n</ul>"}, {"t": "PLTR", "title": "PLTR – Palantir | סקירת EB מקוצרת | 3.11.2026", "desc": "מניה; תוכנת נתונים/AI", "qty": 4.5908, "cost": 130.69, "price": 178.34, "value": 818.72, "pnl": 36.5, "w": 3.72, "v": "hold", "vl": "להחזיק", "lv": [120, 210], "s": [["2024-11-04", 41.41, null, null], ["2024-11-06", 55.53, null, null], ["2024-11-08", 58.39, null, null], ["2024-11-12", 59.85, null, null], ["2024-11-14", 59.18, null, null], ["2024-11-18", 61.26, null, null], ["2024-11-20", 62.12, null, 67, 760.86], ["2026-08-28", 798.35, 891.07, 763.31], ["2026-09-01", 777.31, 882.54, 765.52], ["2026-09-03", 798.24, 874.9, 767.97], ["2026-09-08", 820.53, 866.64, 770.68], ["2026-09-10", 803.09, 857.19, 773.32], ["2026-09-14", 782.14, 850.23, 775.81], ["2026-09-16", 780.86, 843.44, 777.97], ["2026-09-18", 807.07, 837.94, 780.31], ["2026-09-22", 806.09, 832.84, 782.6], ["2026-09-24", 803.34, 828.31, 784.7], ["2026-09-28", 818.0, 826.06, 786.99], ["2026-09-30", 808.87, 823.73, 789.0], ["2026-10-02", 843.41, 821.49, 791.45], ["2026-10-06", 861.39, 820.49, 794.29], ["2026-10-08", 794.29, 820.22, 796.65], ["2026-10-12", 797.47, 819.74, 798.86], ["2026-10-14", 747.2, 816.05, 800.67], ["2026-10-16", 729.03, 810.83, 802.25], ["2026-10-20", 723.52, 806.27, 803.68], ["2026-10-22", 702.38, 801.18, 804.74], ["2026-10-26", 692.13, 794.59, 805.65], ["2026-10-28", 713.38, 788.76, 806.6], ["2026-10-30", 622.75, 781.61, 806.63], ["2026-11-02", 613.62, 777.36, 806.49]], "html": "<p><strong>השורה התחתונה: להחזיק. לא למכור בבהלה, וגם לא לחזק עכשיו.</strong>\nהעסק עצמו חזק ואף משתפר. הירידה נובעת בעיקר מכך שהמניה הייתה יקרה מדי בשיא, ולא מהתדרדרות בעסק. במחיר של היום, $613.62, המניה נסחרת בערך באמצע טווח השווי ההוגן שחישבתי ($520–$710). לכן אין כאן \"מציאה\" שמצדיקה חיזוק.</p>\n<h2>הפוזיציה שלך</h2>\n<ul>\n<li><strong>כמה מחזיקים:</strong> 1.1581 מניות, עלות ממוצעת $863.42. השווי היום $710.63, הפסד של 28.9% (כ-$289).</li>\n<li><strong>משקל:</strong> 3.4% משווי המניות, 2.4% מכל החשבון.</li>\n<li><strong>כמה צריך כדי לחזור לעלות:</strong> המניה צריכה לעלות 41%. בתרחיש הבסיס שלי זה לא יקרה בשנה הקרובה.</li>\n<li><strong>איך נוצר ההפסד:</strong> השיא היה $1,060 ב-30.6.2026, והקנייה כנראה הייתה בתקופה שבה המניה הייתה בין $800 ל-$1,000. מאז היא ירדה 42% מהשיא.</li>\n<li>מקור המחירים: Yahoo Finance, סגירה ל-2.11.2026.</li>\n</ul>\n<h2>מה החברה עושה ולמה היא מוגנת מתחרות (חפיר)</h2>\n<ul>\n<li><strong>מה היא מוכרת:</strong> קטרפילר היא היצרנית הגדולה בעולם של ציוד בנייה וכרייה. יש לה גם מגזר \"כוח ואנרגיה\": גנרטורים ומנועים, ובהם גנרטורים לחוות שרתים של AI. זה המגזר הגדול שלה היום.</li>\n<li><strong>החפיר, כלומר יתרון שקשה למתחרים להעתיק:</strong></li>\n<li>רשת סוכנים (דילרים) עולמית שמספקת חלקים ושירות.</li>\n<li>בסיס ענק של מכונות שכבר נמכרו, שמייצר הכנסה קבועה מחלקים ומשירות.</li>\n<li>מותג חזק שמאפשר להעלות מחירים: ברבעון האחרון העלאות המחירים הוסיפו $663 מיליון.</li>\n</ul>\n<h2>נתונים עסקיים (מקור: הודעת החברה על רבעון 3, 29.10.2026)</h2>\n<ul>\n<li><strong>הכנסות:</strong> $20.7 מיליארד, עלייה של 17% לעומת אותו רבעון אשתקד.</li>\n<li><strong>רווח למניה מתואם</strong> (בלי הוצאות חד-פעמיות): $7.20, עלייה של 45%.</li>\n<li><strong>שולי רווח תפעולי:</strong> 20.6%, לעומת 17.5% אשתקד.</li>\n<li><strong>צבר הזמנות:</strong> שיא של $78.1 מיליארד, כ-$38 מיליארד יותר משנה קודם. אלה הזמנות שכבר התקבלו ועוד לא סופקו.</li>\n<li><strong>מכסים (טריפים):</strong> עולים לחברה כ-$2.2 מיליארד בשנת 2026.</li>\n<li><strong>תזרים מזומנים חופשי (FCF, המזומן שנשאר אחרי השקעות) ב-12 החודשים האחרונים (TTM):</strong> כ-$4.1 מיליארד לפי Yahoo, אבל הנתון לא מעודכן ברבעון 3 ולכן כנראה נמוך מדי. ברבעון 3 לבדו התזרים מפעילות היה $4.4 מיליארד, ובאותו רבעון החברה החזירה לבעלי המניות $1.9 מיליארד ברכישה עצמית של מניות ובדיבידנדים.</li>\n<li><strong>מאזן:</strong> חוב של $45.2 מיליארד מול מזומן של $7.1–7.9 מיליארד. רוב החוב שייך לזרוע המימון של החברה, שמממנת ללקוחות את קניית הציוד, וזה מקובל בענף.</li>\n</ul>\n<h2>תמחור מול חברות דומות (Yahoo Finance, 3.11.2026)</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>מכפיל רווח היסטורי</th>\n<th>מכפיל רווח צפוי</th>\n<th>EV/EBITDA</th>\n<th>צמיחת הכנסות</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CAT</td>\n<td>24.1</td>\n<td>19.0</td>\n<td>18.6</td>\n<td>17%</td>\n</tr>\n<tr>\n<td>Deere (DE)</td>\n<td>37.1</td>\n<td>29.3</td>\n<td>27.6</td>\n<td>5%</td>\n</tr>\n<tr>\n<td>Eaton (ETN)</td>\n<td>37.2</td>\n<td>22.4</td>\n<td>24.5</td>\n<td>21%</td>\n</tr>\n<tr>\n<td>PACCAR (PCAR)</td>\n<td>19.6</td>\n<td>15.0</td>\n<td>16.5</td>\n<td>19%</td>\n</tr>\n</tbody>\n</table>\n<p>הסברים: <strong>מכפיל רווח (P/E)</strong> הוא מחיר המניה חלקי הרווח למניה. <strong>EV/EBITDA</strong> הוא שווי החברה כולל החוב, חלקי הרווח התפעולי לפני פחת. בשני המדדים, נמוך יותר פירושו זול יותר.\n<strong>המסקנה:</strong> CAT כבר לא יקרה מול המתחרות, אבל גם לא זולה במיוחד.</p>\n<p><strong>טווח שווי הוגן (הערכה גסה):</strong> לקחתי את הרווח למניה הצפוי לשנה הבאה, $32.3 (ממוצע אנליסטים לפי Yahoo), והכפלתי אותו במכפיל שבין 16 ל-22. זה הטווח הרגיל של CAT ושל המתחרות. התוצאה היא <strong>$520–$710, עם אמצע של כ-$610</strong>. למטרה הממוצעת של 26 אנליסטים, $838, אני מתייחס בזהירות. <strong>שימו לב: עוד לא בניתי מודל DCF מלא</strong> (היוון של תזרימי המזומנים העתידיים). אם מחליטים לחזק, זה הצעד הבא.</p>\n<h2>תזה בשלוש סיבות</h2>\n<ol>\n<li><strong>ביקוש ל-AI ולחשמל:</strong> מגזר הכוח והאנרגיה צמח ב-18% ברבעון, והרווח בו עלה ב-31%. יש הזמנות עד 2029–2030.</li>\n<li><strong>צבר שיא של $78 מיליארד:</strong> הוא נותן ביטחון בהכנסות לשנים הקרובות.</li>\n<li><strong>עסק איכותי שמחזיר כסף למשקיעים:</strong> שולי רווח של 20% ומעלה, רכישה עצמית של מניות ודיבידנד (תשואת דיבידנד של כ-1.1%).</li>\n</ol>\n<h2>הצד האדום (מה יכול להשתבש)</h2>\n<ul>\n<li><strong>תלות במחזור:</strong> החברה תלויה בשני מחזורים. אחד הוא כרייה ובנייה. השני הוא בום חוות השרתים, וכבר יש התנגדות ציבורית להקמה שלהן.</li>\n<li><strong>מכסים:</strong> $2.2 מיליארד בשנה. החברה עצמה צופה שולי רווח בתחתית טווח היעד שלה.</li>\n<li><strong>תנודתיות:</strong> בטא של 1.9 בשנה האחרונה, כלומר המניה נעה בערך פי שניים מהשוק.</li>\n<li><strong>אין קטליזטור ברור:</strong> החברה לא העלתה את התחזית השנתית, ולכן אין סיבה מיידית לעלייה. מבחינה טכנית המניה מתחת לממוצע 50 הימים ולממוצע 200 הימים. מדד RSI (חוזק יחסי) עומד על 23, כלומר המניה בירידה חריגה (\"מכירת יתר\"), שלפעמים מקדימה התאוששות קצרה.</li>\n</ul>\n<h2>אירוע שיפריך את התזה</h2>\n<ul>\n<li><strong>הצבר מתחיל לרדת</strong> מרבעון לרבעון.</li>\n<li><strong>או שבדוח של רבעון 4</strong> (סוף ינואר או תחילת פברואר 2027) החברה צופה ל-2027 צמיחה של פחות מ-5%, או שולי רווח מתחת ל-18%.</li>\n</ul>\n<h2>כלל החלטה, ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>$520 ומטה, עם צבר שעדיין גדל:</strong> לבחון חיזוק עד משקל של כ-4% מהמניות. זו תוספת של כ-$150–$200.</li>\n<li><strong>סגירה מתחת ל-$520, ובמקביל ירידה בצבר או תחזית חלשה ל-2027:</strong> לבחון צמצום או מכירה.</li>\n<li><strong>מעל $710:</strong> המניה בקצה העליון של השווי ההוגן. לא לחזק.</li>\n<li><strong>הנקודה המרכזית:</strong> העלות שלך, $863, לא קשורה לשאלה מה המניה שווה היום. ההחלטה צריכה לנבוע מהשווי, לא מהרצון להחזיר את ההפסד.</li>\n<li><strong>מס:</strong> אפשר לממש את ההפסד כדי לקזז אותו מול רווחים אחרים, למשל ב-AMD. כדאי לבדוק את זה עם רואה חשבון.</li>\n</ul>\n<h2>בדיקה עצמית</h2>\n<ul>\n<li><strong>FCF:</strong> הנתון נמשך מ-Yahoo ולא אומת מול הדוח המלא (10-Q) ב-EDGAR, מערכת הדיווחים של רשות ניירות הערך האמריקאית.</li>\n<li><strong>שווי הוגן:</strong> מבוסס על מכפילים בלבד, בלי DCF.</li>\n<li><strong>מחיר קנייה:</strong> לא ידוע לי מתי הקנייה בוצעה בדיוק.</li>\n<li><strong>זה לא ייעוץ השקעות.</strong></li>\n</ul>\n<p><strong>מקורות:</strong>\n- Caterpillar, הודעה על תוצאות רבעון 3 של 2026, 29.10.2026: caterpillar.com/en/news/corporate-press-releases/h/3q26-results-caterpillar-inc.html\n- The Globe and Mail / Reuters, 29.10.2026.\n- Jolt Journal, 29.10.2026.\n- Yahoo Finance דרך yfinance: מכפילים, נתוני FCF ותחזיות אנליסטים, 3.11.2026.</p>"}, {"t": "MP", "title": "MP – MP Materials | סקירת עומק מקוצרת (EB מקוצר) | 3.11.2026", "desc": "מניה; מתכות נדירות", "qty": 17.6107, "cost": 58.32, "price": 38.35, "value": 675.37, "pnl": -34.2, "w": 3.07, "v": "risky", "vl": "מסוכנת", "lv": [30], "s": [["2024-11-04", 18.25, null, null], ["2024-11-06", 19.68, null, null], ["2024-11-08", 19.5, null, null], ["2024-11-12", 19.85, null, null], ["2024-11-14", 18.57, null, null], ["2024-11-18", 18.35, null, null], ["2024-11-20", 18.23, null, null], ["2024-11-22", 19.64, null, null], ["2024-11-26", 20.25, null, null], ["2024-11-29", 21.07, null, null], ["2024-12-03", 23.11 0", 51.32, 51.31, 57.56], ["2026-09-14", 50.68, 51.18, 57.5], ["2026-09-16", 48.99, 51.07, 57.39], ["2026-09-18", 47.26, 50.91, 57.28], ["2026-09-22", 51.04, 50.9, 57.19], ["2026-09-24", 49.3, 50.86, 57.06], ["2026-09-28", 46.45, 50.95, 56.93], ["2026-09-30", 47.29, 50.96, 56.8], ["2026-10-02", 46.97, 51.02, 56.72], ["2026-10-06", 48.53, 51.24, 56.67], ["2026-10-08", 46.14, 51.5, 56.6], ["2026-10-12", 43.36, 51.63, 56.5], ["2026-10-14", 39.95, 51.45, 56.38], ["2026-10-16", 40.17, 51.18, 56.27], ["2026-10-20", 39.05, 50.62, 56.14], ["2026-10-22", 38.56, 49.99, 55.93], ["2026-10-26", 37.47, 49.22, 55.69], ["2026-10-28", 41.06, 48.56, 55.47], ["2026-10-30", 39.57, 47.95, 55.21], ["2026-11-02", 38.35, 47.51, 55.07]], "html": "<p><strong>שורה תחתונה: מסוכנת. לא מוסיפים כסף כדי להוריד את מחיר הקנייה הממוצע. מחליטים רק אחרי הדוח של 5.11.</strong>\nהחברה נמצאת במקום טוב מבחינה אסטרטגית, אבל היא עדיין מפסידה כסף ושורפת מזומנים. מחיר המניה זז בעיקר לפי כותרות על היחסים בין ארה\"ב לסין ולא לפי התוצאות שלה.</p>\n<h2>הפוזיציה שלך</h2>\n<p>17.6107 מניות בעלות ממוצעת של $58.32. המחיר היום $38.35, ולכן השווי $675 וההפסד 34.2%. המשקל הוא 3.2% מהמניות. המניה 47% מתחת לשיא של 52 השבועות האחרונים. (Yahoo, סגירה 2.11.2026)</p>\n<h2>העסק והחפיר</h2>\n<ul>\n<li><strong>מה החברה עושה:</strong> מפעילה את Mountain Pass, מכרה מתכות נדירות היחיד בהיקף משמעותי בארה\"ב. היא מפיקה NdPr, שתי מתכות נדירות שמהן מייצרים את המגנטים החזקים ביותר לרכבים חשמליים, לרחפנים ולתעשייה הביטחונית. במקביל היא מקימה מפעלי מגנטים בטקסס, ובהם מפעל 10X.</li>\n<li><strong>החפיר:</strong> אין כמעט עוד מקור כזה מחוץ לסין, ויש לה הסכם עם הפנטגון. ההסכם כולל רצפת מחיר ל-NdPr ל-10 שנים, מימון והתחייבויות רכש. בנוסף יש לה עסקאות עם GM ועם אפל.</li>\n<li><strong>מה מחליש את החפיר:</strong> היתרון קיים רק כל עוד סין מגבילה יצוא. כשיש הפשרה ביחסים, הוא נשחק. וכשהמחיר בשוק קרוב לרצפה, הרצפה מוסיפה רק כ-$10 לק\"ג (Finviz, אוקטובר 2026).</li>\n</ul>\n<h2>נתונים פיננסיים</h2>\n<ul>\n<li><strong>הכנסות:</strong> ברבעון 2 של 2026 הן היו $108.5M, עלייה של 89%. מכירות ה-NdPr עלו ב-127% (Tickeron). ב-12 החודשים האחרונים (TTM) ההכנסות היו $416M (Yahoo).</li>\n<li><strong>רווחיות:</strong> שולי רווח גולמי 42%, אבל שולי רווח תפעולי של מינוס 15%. הרווח למניה ב-12 החודשים האחרונים שלילי: ‎-$0.33.</li>\n<li><strong>תזרים מזומנים חופשי (FCF) ב-12 החודשים האחרונים:</strong> בערך ‎-$0.4 עד ‎-$0.5 מיליארד. אימתתי מול הדוחות הרשמיים ב-EDGAR, מאגר הדוחות של רשות ניירות ערך האמריקאית: התזרים מפעילות שוטפת היה בערך ‎-$0.09B וההשקעות ברכוש קבוע בערך ‎$0.4B. הנתון של Yahoo הוא ‎-$0.43B. ההשקעות המתוכננות הן $500–600M בשנה.</li>\n<li><strong>מאזן:</strong> מזומן $1.45B מול חוב $0.98B. יש כרית ביטחון, אבל היא מצטמקת.</li>\n</ul>\n<h2>תמחור</h2>\n<ul>\n<li><strong>מכפיל מכירות של 16.4.</strong> כלומר, שווי החברה גבוה פי 16.4 מההכנסות של 12 החודשים האחרונים. אין מכפיל רווח (P/E), כי אין רווח.</li>\n<li><strong>מכפיל רווח צפוי של 51.7.</strong></li>\n<li><strong>השוואה:</strong> ל-Lynas, המתחרה האוסטרלית, מכפיל מכירות של 8.5, והיא כבר רווחית.</li>\n<li><strong>מחיר יעד של אנליסטים:</strong> בממוצע $70.9, לפי 16 אנליסטים. אני לא מסתמך עליו.</li>\n<li><strong>אין לי טווח שווי הוגן אמין.</strong> החברה עוד לא רווחית, ולכן כל הערכת שווי היא בעצם הימור על כך שמפעל 10X יעבוד בהצלחה.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>ספק אסטרטגי יחיד בארה\"ב, עם רצפת מחיר מהפנטגון ל-10 שנים.</li>\n<li>מעבר לייצור מגנטים, שבהם הרווח גבוה יותר. המשלוחים המסחריים ל-GM צפויים להתחיל ברבעון 4 של 2026.</li>\n<li>צמיחה מהירה בכמויות.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li>הפסדים ושריפת מזומנים עד 2027 לפחות.</li>\n<li>הפשרה ביחסי ארה\"ב-סין מורידה את \"פרמיית המחסור\", כלומר את התוספת שהשוק משלם על כך שיש מעט מקורות.</li>\n<li>סיכון פוליטי: ארה\"ב עשויה לסגת מהבטחות לרצפת מחיר, ויש בחירות אמצע הקדנציה בנובמבר.</li>\n<li>תנודתיות חריפה: בטא של 2.6. כלומר, המניה זזה בערך פי 2.6 מהשוק.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<ul>\n<li>בדוח של 5.11.2026: תפוקת NdPr של פחות מ-1,000 טון ברבעון, או דחייה של המשלוחים ל-GM.</li>\n<li>או שהמזומן יורד מתחת ל-$1B בלי מימון חדש.</li>\n</ul>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>לא לחזק לפני 5.11.</strong> גם אחרי הדוח, לחזק רק אם יעמדו בשני היעדים: יותר מ-1,000 טון, ומשלוחים ל-GM ברבעון 4.</li>\n<li><strong>אם תהיה סגירה מתחת ל-$30 (עוד 22% ירידה), או שאחד היעדים לא יושג:</strong> לבחון מחדש צמצום חצי מהפוזיציה או יותר.</li>\n<li><strong>תקרה:</strong> לא יותר מ-3% מהמניות, כי מדובר בפוזיציה ספקולטיבית.</li>\n<li><strong>מס:</strong> אפשר לממש את ההפסד ולקזז אותו מול רווחים אחרים, למשל ב-AMD. כדאי לבדוק את זה עם רואה חשבון.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>נתוני הרבעון השלישי עוד לא פורסמו. הנתונים כאן הם עד רבעון 2.</li>\n<li>נתוני ההשקעות ברכוש קבוע למחצית הראשונה של 2025 משוערים, ולכן גם ה-FCF.</li>\n</ul>\n<p><strong>מקורות:</strong> SEC EDGAR companyfacts, 10-Q שפורסם ב-7.8.2026. Yahoo Finance דרך yfinance, 3.11.2026. MarketBeat, 30.10.2026. TipRanks. Tickeron. Finviz. Seeking Alpha. כל המקורות מאוקטובר 2026.</p>"}, {"t": "AMD", "title": "AMD – Advanced Micro Devices | סקירת EB מקוצרת | 3.11.2026", "desc": "מניה; שבבי AI/מעבדים", "qty": 1.4217, "cost": 155.06, "price": 466.84, "value": 663.71, "pnl": 201.1, "w": 3.01, "v": "hold", "vl": "להחזיק", "lv": [352, 512], "s": [["2024-11-04", 140.71, null, null], ["2024-11-06", 145.1, null, null], ["2024-11-08", 147.95, null, null], ["2024-11-12", 143.63, null, null], ["2024-11-14", 138.84, null, null], ["2024-11-18", 138.93, null, null], ["2024-11-20", 137.6, null, null], ["2024-11-22", 138.35, null, null], ["2024-11-26", 137.72, null, null], ["2024-11-29", 137.18, null, null], ["2024-12-03", 141.98, null, null], ["2024-12-05", 141.36, null, null], ["2024-12-09", 130.87, null, null], ["2024-12-11", 130.15, null, null], ["2024-12-13", 126.91, null, null], ["2024-12-17", 125.02, null, null], ["2024-12-19", 118.88, null, null], ["2024-12-23", 124.6, null, null], ["2024-12-26", 125.06, null, null], ["2024-12-30", 122.44, null, null], ["2025-01-02", 120.63, null, null], ["2025-0 ספר 2, הרחק מאחורי Nvidia, ופלטפורמת התוכנה שלה, ROCm, חלשה יותר מזו של Nvidia.</li>\n</ul>\n<h2>מספרים</h2>\n<ul>\n<li><strong>צמיחה ורווחיות:</strong> ההכנסות צמחו ב-50%. שולי הרווח הגולמי הם 56% ושולי הרווח התפעולי 17% (Yahoo).</li>\n<li><strong>תזרים מזומנים חופשי (FCF) ב-12 החודשים האחרונים (TTM):</strong> כ-$8.4B. אימתתי מול הדוחות שהחברה הגישה לרשות ניירות ערך האמריקאית (SEC), במאגר EDGAR, עד 27.6.2026: תזרים מפעילות של $10.1B פחות השקעות ברכוש קבוע של $1.7B.</li>\n<li><strong>תשואת FCF:</strong> 1.1%. זה ה-FCF השנתי חלקי שווי השוק של החברה, ומשמעותו שהמניה יקרה ביחס למזומן שהחברה מייצרת היום.</li>\n<li><strong>מאזן:</strong> מזומן של $13.1B מול חוב של $4.3B.</li>\n</ul>\n<h2>תמחור</h2>\n<ul>\n<li><strong>מכפיל רווח צפוי של 29.2.</strong> זה מחיר המניה חלקי הרווח למניה הצפוי בשנה הבאה. לשם השוואה: NVDA ‏12.7, Broadcom ‏16.6.</li>\n<li><strong>שווי הוגן משוער:</strong> $352–$512, ובאמצע כ-$430. החישוב: רווח צפוי של $16.0 למניה, כפול מכפיל של 22 עד 32.</li>\n</ul>\n<h2>תזה (3 סיבות)</h2>\n<ol>\n<li>נתח השוק במעבדים לשרתים ממשיך לגדול.</li>\n<li>שבבי הבינה המלאכותית מסדרת MI הם החלופה העיקרית ל-Nvidia.</li>\n<li>צמיחה של 50%.</li>\n</ol>\n<h2>הצד האדום</h2>\n<ul>\n<li>המניה יקרה בהרבה מ-NVDA, למרות שהעסק שלה חלש יותר.</li>\n<li>התנודתיות קיצונית: בטא של 3.3.</li>\n<li>כל ההצדקה למחיר תלויה בעסקאות גדולות עם לקוחות בתחום הבינה המלאכותית.</li>\n</ul>\n<h2>מה יפריך את התזה</h2>\n<p>התחזית ברבעון 4 מראה האטה בהכנסות ממרכזי נתונים, או ששולי הרווח הגולמי יורדים מתחת ל-54%.</p>\n<h2>כלל החלטה ורמות לבחינה מחדש</h2>\n<ul>\n<li><strong>אם המחיר עולה מעל $512 או שהמשקל עולה מעל 4% מהמניות:</strong> לבחון מכירה של כשליש מהפוזיציה.</li>\n<li><strong>לא להוסיף כסף</strong> במחירים הנוכחיים.</li>\n<li><strong>אם המחיר יורד מתחת ל-$352 והתזה עדיין עומדת:</strong> להחזיק בלי לעשות דבר.</li>\n<li><strong>מס:</strong> רווח שתממש כאן אפשר לקזז מול ההפסדים ב-CAT וב-MP. כדאי לבדוק עם רואה חשבון.</li>\n</ul>\n<h2>ביקורת עצמית</h2>\n<ul>\n<li>נתוני הרבעון השלישי עוד לא פורסמו, וה-FCF אחד עם IONQ לכיוון אחד.", "source": "https://finance.yahoo.com/quote/QTUM/history/", "source_name": "Yahoo Finance"}, {"ticker": "GOOG", "date": "2026-11-05", "impact": "positive", "headline": "השקעה של $17B בחוות שרתים ראשונה בוויומינג, למרות התנגדות פוליטית", "text": "גוגל הודיעה על בניית חוות השרתים הראשונה שלה בוויומינג בהשקעה של $17 מיליארד, עם תחנת תאי דלק של 702 מגה-וואט ולכידת פחמן (Bloom Energy). זה מגיע בזמן שהשוק חושש מהקפאות אחרי בחירות האמצע — וויומינג היא מדינה רפובליקנית. מחזק את תזת ההמשך בהשקעות תשתיות AI, אבל לא משנה את כלל ההחלטה (לא לחזק לפני דוח רבעון 4).", "source": "https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/wyoming-data-center/", "source_name": "Google Blog / Reuters"}, {"ticker": "PLTR", "date": "2026-11-05", "impact": "positive", "headline": "חוזה ארגוני עם AmeriLife לפריסת Foundry ו-AIP בביטוח ופרישה", "text": "Palantir חתמה עם AmeriLife (רשת הפצה לביטוח ופרישה בארה\"ב) על פריסה ארגונית של Foundry ופלטפורמת הבינה המלאכותית AIP, כבר בפרודקשן ב-Crump Life Insurance. אין גילוי על היקף הכספי, אבל זה מחזק את תזת הצמיחה המסחרית בארה\"ב בזמן שהמניה ירדה חזק עם מניות ה-AI. עדיין מעל רמת החיזוק ($120).", "source": "https://investors.palantir.com/news-details/2026/AmeriLife-and-Palantir-Announce-Enterprise-Partnership-to-Bring-AI-Driven-Transformation-to-Insurance-and-Retirement-Distribution", "source_name": "Palantir IR"}, {"ticker": "MSFT", "date": "2026-11-05", "impact": "neutral", "headline": "מיקרוסופט מצמצמת עסקאות עם ספקי ענן חיצוניים (neocloud) ומעדיפה חוות משלה", "text": "לפי Bloomberg, מיקרוסופט מהדקת פיקוח על פרויקטים של Nebius, IREN ו-Nscale, לא תרחיב את החוזה עם Nscale בטקסס, ושוקלת פנימית אם לחתום על עסקאות neocloud חדשות. החברה אומרת שהיא משלבת חוות בבעלותה, השכרה ושיתופי פעולה. זה מצביע על משמעת בהשקעות AI ולא על קיצוץ בביקוש עצמו; אין שינוי בכלל ההחלטה (רחוק מרמת החיזוק $500).", "source": "https://www.investing.com/news/stock-market-news/microsoft-tightens-oversight-of-neocloud-data-center-projects-bloomberg-news-reports-5005281", "source_name": "Reuters / Bloomberg"}, {"ticker": "AMD", "date": "2026-11-04", "impact": "positive", "headline": "דוח חזק מהצפוי, והמניה עברה במסחר המאוחר את רמת המימוש ($512)", "text": "ההכנסות ברבעון 3 עלו 45% ל-$13.4B (צפי: $13.1B), ומכירות מרכזי הנתונים כמעט הוכפלו ל-$8.55B. התחזית לרבעון 4 היא $17B, מעל הצפי של $16.2B, וההנהלה צופה צמיחה של יותר מ-80% ב-2027. המניה עלתה כ-8% במסחר שאחרי הסגירה לכ-$520, מעל רמת $512 שבה קבענו לבחון מכירה של כשליש מהפוזיציה.", "source": "https://ir.amd.com/news-events/press-releases/detail/1303/amd-reports-third-quarter-2026-financial-results", "source_name": "AMD Investor Relations / Investing.com"}, {"ticker": "NVDA", "date": "2026-11-04", "impact": "negative", "headline": "ניצחון הדמוקרטים בבחירות האמצע מעורר חשש מהגבלות על חוות שרתים", "text": "הדמוקרטים זכו בשני בתי הקונגרס ובמושל טקסס, שהבטיחה להקפיא בנייה של חוות שרתים; לפי Wells Fargo כ-27% מהקיבולת המתוכננת בארה\"ב נמצאת בטקסס. החוזים העתידיים על נאסד\"ק 100 ירדו כ-0.8% בלילה. זה נוגע ישירות לתזת הביקוש לשבבים ולחוות שרתים (גם AMD, GEV ומניות הענן), אבל חקיקה פדרלית קשה להעביר מול וטו של הנשיא.", "source": "https://www.cnbc.com/2026/11/04/ai-stocks-texas-governor-data-centers.html", "source_name": "CNBC / Reuters"}, {"ticker": "GEV", "date": "2026-11-04", "impact": "negative", "headline": "סיכון חדש לביקוש: מושלת טקסס הנבחרת תומכת בהקפאת חוות שרתים", "text": "חלק מהתזה על GE Vernova נשען על הביקוש לחשמל מצד חוות השרתים, וטקסס היא השוק הגדול ביותר שלהן. בשלב זה מדובר בחשש בשוק ולא בהחלטה בפועל, וכדאי לעקוב אם מגיעים לחקיקה ברמת המדינה.", "source": "https://www.investing.com/news/economy-news/morning-bid-markets-fret-blue-wave-will-drown-data-centres-4997373", "source_name": "Reuters"}, {"ticker": "TSLA", "date": "2026-11-04", "impact": "negative", "headline": "ירידה של כ-4.5% לפני פתיחת המסחר אחרי ניצחון הדמוקרטים בבחירות האמצע", "text": "המשקיעים חוששים מפיקוח הדוק יותר על הנהיגה האוטונומית ועל החוזים הממשלתיים של חברות מאסק, וגם ממכשולים למיזוג אפשרי עם SpaceX. המניה ירדה לכ-$380 לפני הפתיחה, עדיין מעל מחיר הקנייה הממוצע ($333.78) ורחוק מרמת הבחינה ($450).", "source": "https://www.investing.com/news/stock-market-news/why-is-tesla-stock-tumbling-today-93CH-4997818", "source_name": "Investing.com / MarketWatch"}, {"ticker": "AMD", "date": "2026-11-04", "impact": "positive", "headline": "שורת בנקים העלתה מחירי יעד אחרי הדוח, והמניה עלתה כ-7% לפני הפתיחה", "text": "Morgan Stanley העלתה את מחיר היעד מ-$510 ל-$550, Stifel ל-$725, Truist ל-$605 ו-Raymond James ל-$649. BofA הורידה ל-$650 בגלל ירידת מכפילים בכל הענף, לא בגלל החברה עצמה.", "source": "https://www.investing.com/news/stock-market-news/why-is-advanced-micro-devices-stock-surging-today-93CH-4997815", "source_name": "Investing.com"}, {"ticker": "AMZN", "date": "2026-11-04", "impact": "positive", "headline": "קפיצה של כ-7.5% בפתיחת המסחר, בזכות צמיחת AWS ושורת המלצות", "text": "המשקיעים חוזרים להתמקד בצמיחה של AWS (שירותי הענן של אמזון), שעלתה 39% ברבעון, והקיבולת ל-2026 כבר נמכרה. Mizuho ו-BMO העלו מחירי יעד ל-$335 ול-$390. המחיר (כ-$270) עדיין מעל רמת החיזוק ($218).", "source": "https://ca.investing.com/news/stock-market-news/why-is-amazon-stock-surging-today-93CH-4930400", "source_name": "Investing.com"}, {"ticker": "MSFT", "date": "2026-11-04", "impact": "positive", "headline": "עלייה של כ-6% וקרוב לשיא שנתי, אחרי דוח חזק והמשך המלצות", "text": "ההמשך לדוח: Azure (הענן של מיקרוסופט) צמח 48% וצבר ההזמנות קפץ 73% ל-$677B. BNP Paribas העלתה מחיר יעד ל-$632. המחיר (כ-$555) רחוק מרמת החיזוק ($500), כך שאין שינוי בכלל ההחלטה.", "source": "https://in.investing.com/news/stock-market-news/why-is-microsoft-stock-surging-today-93CH-5679566", "source_name": "Investing.com"}, {"ticker": "GEV", "date": "2026-11-04", "impact": "negative", "headline": "ירידה של כ-6%–8% בפתיחת המסחר, אחרי ניצחון הדמוקרטים בבחירות", "text": "המשקיעים מוכרים מניות שקשורות לבניית חוות שרתים מחשש לפיקוח הדוק יותר בקונגרס. הביקוש עצמו לא השתנה (צבר של $197B), וחוות שרתים הן רק כ-20% מהביקוש לטורבינות. המחיר (כ-$843) מתקרב לרמת החיזוק ($800) אבל עוד לא הגיע אליה.", "source": "https://www.devdiscourse.com/article/international/4001678-ai-data-center-stocks-slide-renewables-rally-after-democratic-us-midterm-sweep", "source_name": "Reuters (via Devdiscourse)"}, {"ticker": "FORM", "date": "2026-11-04", "impact": "negative", "headline": "צניחה של כ-12.5% (לכ-$85), יחד עם כל מניות ציוד השבבים", "text": "המכירה רוחבית בכל הענף (ONTO ירדה 9%, ENTG כ-7%). ברקע גם פרטים מהדוח הרבעוני: חלק מהשיפור ברווחיות הגיע מהחזר מכסים חד-פעמי (כ-$8.6M), ומפעל חדש בטקסס יעלה עלויות. המחיר עדיין מעל רמת החיזוק ($77).", "source": "https://news.alphastreet.com/formfactor-plunges-11-7-amid-sector-wide-selling/", "source_name": "AlphaStreet"}, {"ticker": "GEV", "date": "2026-11-04", "impact": "negative", "headline": "הירידה העמיקה לכ-10.5% בסגירה (כ-$821), כ-3% מעל רמת החיזוק ($800)", "text": "לחשש מפיקוח על חוות שרתים אחרי הבחירות נוספו הורדות מחירי יעד של אנליסטים. הביקוש עצמו לא השתנה: ההזמנות צמחו 96% וחוות שרתים הן רק כ-20% מהביקוש לטורבינות.", "source": "https://www.streetinsider.com/Investing/GE+Vernova+shares+drop+as+analysts+cut+price+targets/27287677.html", "source_name": "StreetInsider"}, {"ticker": "CAT", "date": "2026-11-04", "impact": "negative", "headline": "ירידה של כ-6.5% (לכ-$584), בלי חדשות מהחברה", "text": "המשקיעים מתייחסים לקטרפילר כמניית חשמל לחוות שרתים ומכרו אותה יחד עם כל הענף אחרי ניצחון הדמוקרטים. ברקע נמשכות הורדות מחירי יעד אחרי הדוח (Morgan Stanley ל-$675, Citi ל-$800). רמת הבחינה מחדש ($520) עוד רחוקה.", "source": "https://finance.yahoo.com/markets/stocks/articles/caterpillar-sinks-6-democrats-win-164541866.html", "source_name": "Yahoo Finance"}, {"ticker": "KEYS", "date": "2026-11-04", "impact": "neutral", "headline": "ירידה של כ-7% (לכ-$284), בלי הודעה מהחברה", "text": "חלק מהמכירה הרחבה במניות טכנולוגיה יקרות שקשורות לבינה מלאכותית. המניה ירדה כ-24% בחודש האחרון, אבל עדיין מעל רמת החיזוק ($260).", "source": "https://www.tipranks.com/news ns-EPC-Contract-with-TeraWulf-for-Large-Scale-Data-Center-Campus-in-Kentucky/default.aspx", "source_name": "Fluor Newsroom"}, {"ticker": "META", "date": "2026-11-04", "impact": "neutral", "headline": "גיוס של כ-15 מיליארד דולר באג\"ח למימון השקעות AI, וריבית של 7.5% ל-30 שנה", "text": "Meta תמחרה הנפקת אג\"ח דולרית בחמש סדרות בהיקף של כ-15 מיליארד דולר (ביקושים של כ-58 מיליארד), והשיקה גם הנפקת אירו ראשונה. הקופון ל-30 שנה הגיע ל-7.5%. המימון נועד להשקעות בחוות שרתים, אחרי ש-S&P העבירה את התחזית לדירוג ל-Negative. זה משלים את תמונת המימון (יחד עם הנפקת המניות שכבר רשמנו) ולא משנה לבד את כלל ההחלטה — עדיין לא לחזק לפני שיתבהרו פרטי הגיוס וההשקעות ל-2027.", "source": "https://www.reuters.com/5f374b32b07b/technology/meta-raises-15-billion-in-five-part-us-bond-sale-2026-11-03/", "source_name": "Reuters"}, {"ticker": "MP", "date": "2026-11-03", "impact": "neutral", "headline": "עלייה של כ-6% יחד עם כל מניות המתכות", "text": "המניה עלתה כ-6% באמצע היום, יחד עם Freeport ו-Rio Tinto, בלי חדשה ספציפית על החברה. הדוח הרבעוני יוצא ב-5.11 אחרי סגירת המסחר, והוא נקודת הבדיקה האמיתית.", "source": "https://ibusiness.news/news/2026-11-03/mp-materials-mp-surges-6-as-metals-sector-rallies-and-analyst-support-holds-firm/", "source_name": "iBusiness News"}, {"ticker": "PLTR", "date": "2026-11-03", "impact": "negative", "headline": "הדוח עקף את התחזיות, אבל המניה ירדה", "text": "ההכנסות ברבעון 3 עלו 96% ל-$2.31B והחברה העלתה שוב את התחזית השנתית, אבל ערך החוזים החדשים שנחתמו צמח רק 6% (לעומת 49% ברבעון הקודם). המניה ירדה כ-4% היום ונמצאת ברמה הנמוכה מאז ספטמבר; רוב הבנקים העלו מחיר יעד (Citi ל-$265, Morgan Stanley ל-$233), ו-Jefferies נשארה שלילית עם יעד $80.", "source": "https://www.cnbc.com/2026/11/03/palantir-stock-q3-earnings-analyst-ratings.html", "source_name": "CNBC"}, {"ticker": "NVDA", "date": "2026-11-03", "impact": "neutral", "headline": "Nvidia מגבילה את השותפים שלה בעסקים עם סין", "text": "לפי ה-Financial Times, Nvidia דורשת מספקיות הענן שמשכירות את השבבים שלה למכור לפחות 5
